name: Architecture boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check cross-product architecture boundary
        run: node scripts/check-architecture-boundary.mjs
