name: Shared directory run verification
on:
  pull_request:
    paths:
      - src/nexus/source-discovery/continuous-directory-*.ts
      - tests/continuous-directory-*.test.ts
      - supabase/migrations/20261023204000_shared_directory_run_budgets.sql
      - package.json
      - package-lock.json
      - .github/workflows/shared-directory-runs.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
